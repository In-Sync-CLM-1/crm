name: Deploy follow-link worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'follow-link-worker/**'
      - '.github/workflows/follow-link-worker-deploy.yml'

concurrency:
  group: follow-link-worker-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy go.in-sync.co.in link handler
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Must be the CURRENT-format sb_secret_ key, not the legacy service_role
      # JWT: this project's legacy keys were disabled on 2026-05-29 and PostgREST
      # now 401s them, which silently breaks every click and unsubscribe write
      # while the redirects still appear to work.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Same project URL as the frontend build uses — it's the public REST host,
      # not a credential; the key above is what grants access.
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy worker
        working-directory: follow-link-worker
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?missing}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?missing}"
          : "${SUPABASE_URL:?missing}"
          npx wrangler@latest deploy
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler@latest secret put SUPABASE_SERVICE_ROLE_KEY
          printf '%s' "$SUPABASE_URL" | npx wrangler@latest secret put SUPABASE_URL
