name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'supabase/**'
      - 'cron-worker/**'
      - '**/*.md'
      - '.github/workflows/supabase-deploy.yml'

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    name: Test agent gate (may this commit go live?)
    steps:
      - name: Ask the test ledger
        env:
          GATE_TOKEN: ${{ secrets.TEST_GATE_TOKEN }}
        run: |
          r=$(curl -sS -X POST https://test-ledger.echocommunicator.workers.dev/gate \
            -H "Authorization: Bearer $GATE_TOKEN" -H "content-type: application/json" \
            -d "{\"repo\":\"${{ github.repository }}\",\"sha\":\"${{ github.sha }}\",\"workflow\":\"${{ github.workflow }}\"}")
          echo "$r"
          echo "$r" | grep -q '"allow": true' || { echo "::error::Not allowed to go live: $(echo "$r" | sed -n 's/.*"reason": "\(.*\)".*/\1/p')"; exit 1; }

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    name: Build and deploy frontend
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy dist --project-name=crm-sync --branch=main --commit-dirty=true

      - name: Ask the test agent to check the live site
        env:
          GH_TOKEN: ${{ secrets.TEST_AGENT_TOKEN }}
        run: |
          gh api repos/In-Sync-CLM-1/test-agent/dispatches -f event_type=live-check \
            -F "client_payload[repo]=${{ github.repository }}" -F "client_payload[sha]=${{ github.sha }}"
