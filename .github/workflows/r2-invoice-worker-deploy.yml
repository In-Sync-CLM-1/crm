name: Deploy customer-file worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'r2-invoice-worker/**'
      - '.github/workflows/r2-invoice-worker-deploy.yml'

concurrency:
  group: r2-invoice-worker-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    name: Test agent gate (may this commit go live?)
    steps:
      - name: Ask the test ledger
        env:
          GATE_TOKEN: ${{ secrets.TEST_GATE_TOKEN }}
        run: |
          r=$(curl -sS -X POST https://test-ledger.echocommunicator.workers.dev/gate \
            -H "Authorization: Bearer $GATE_TOKEN" -H "content-type: application/json" \
            -d "{\"repo\":\"${{ github.repository }}\",\"sha\":\"${{ github.sha }}\",\"workflow\":\"${{ github.workflow }}\"}")
          echo "$r"
          echo "$r" | grep -q '"allow": true' || { echo "::error::Not allowed to go live: $(echo "$r" | sed -n 's/.*"reason": "\(.*\)".*/\1/p')"; exit 1; }

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    name: Deploy crm-invoice-store (client documents and invoices, expiring links only)
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Same secret the file-link server function signs links with (Supabase secret FILE_LINK_SECRET).
      LINK_SECRET: ${{ secrets.FILE_LINK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy worker
        working-directory: r2-invoice-worker
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?missing}"
          : "${LINK_SECRET:?missing}"
          # Secret first, so the new code never runs without it (old code ignores it).
          printf '%s' "$LINK_SECRET" | npx wrangler@latest secret put LINK_SECRET
          npx wrangler@latest deploy
